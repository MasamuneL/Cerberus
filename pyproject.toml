[project]
name = "cerberus"
version = "0.1.0"
description = "App web de exploración, volumetría y segmentación de glioblastoma (CFB-GBM) con FastAPI, Niivue y MONAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "antspyx>=0.5.3",
    "arq>=0.28.0",
    "authlib>=1.9.4",
    "dcm2niix>=1.0.20260724",
    "fastapi>=0.162.0",
    "httpx2>=2.15.1",
    "huggingface-hub>=2.2.0",
    "joserfc>=1.8.0",
    "monai[nibabel]>=1.6.1",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.1",
    "pydicom>=3.0.2",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# Solo para ejecutar la referencia histórica archivada; no se instala por defecto.
notebook = [
    "ipython>=9.17.1",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "mayavi>=4.9.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyqt5>=5.15.11",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
runtime = [
    "antspyx>=0.5.3",
    "arq>=0.28.0",
    "authlib>=1.9.4",
    "dcm2niix>=1.0.20260724",
    "fastapi>=0.162.0",
    "httpx2>=2.15.1",
    "huggingface-hub>=2.2.0",
    "joserfc>=1.8.0",
    "monai[nibabel]>=1.6.1",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.1",
    "pydicom>=3.0.2",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "uvicorn[standard]>=0.54.0",
]
# Variantes de torch (HW1, docs/PLAN_MVP.md §25). Son excluyentes (`[tool.uv] conflicts`) y cada una fija su índice en
# `[tool.uv.sources]`. `torch-cpu` es la de siempre: rueda CPU en Linux y PyPI en macOS/Windows (MPS en Apple
# Silicon). `torch-cu126` es la imagen GPU NVIDIA: `uv sync --only-group runtime --only-group torch-cu126`.
torch-cpu = ["torch>=2.14.1"]
torch-cu126 = ["torch>=2.14.1"]

[tool.uv]
# `uv sync` local instala la variante CPU, igual que antes de HW1 (el paquete ya no declara torch directamente; MONAI
# lo pide igual). Para la variante CUDA, **cada** `uv sync` y `uv run` lleva `--no-group torch-cpu --group torch-cu126`
# (o `uv run --no-sync` tras el sync): un `uv run` sin flags vuelve a los grupos por defecto y reinstala torch CPU.
default-groups = ["dev", "torch-cpu"]
conflicts = [[{ group = "torch-cpu" }, { group = "torch-cu126" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cerberus_api", "backend/cerberus_training"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cerberus_api", "cerberus_training", "conftest"]

[tool.pyright]
include = ["backend"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
extraPaths = ["backend/tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["slow: tests que usan el modelo MONAI real o dcm2niix real"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "torch-cpu", marker = "sys_platform == 'linux'" },
    # CUDA solo existe para Linux y Windows; en macOS la variante cae en la rueda de PyPI (sin CUDA).
    { index = "pytorch-cu126", group = "torch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# cu126 es el índice con driver más amplio que publica torch 2.14.1 cp311 (cu128/cu129 no la publican; cu130/cu132
# exigen driver ≥ 580). Es el mismo índice que training-env/.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
