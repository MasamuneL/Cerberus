[project]
name = "cerberus"
version = "0.1.0"
description = "EDA, visualización 3D y segmentación de glioblastoma (CFB-GBM) con marimo, Mayavi y MONAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "antspyx>=0.5.3",
    "arq>=0.28.0",
    "authlib>=1.9.4",
    "dcm2niix>=1.0.20260724",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "ipython>=9.17.1",
    "joserfc>=1.8.0",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "mayavi>=4.9.0",
    "monai[nibabel]>=1.6.1",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic-settings>=2.16.1",
    "pydicom>=3.0.2",
    "pyqt5>=5.15.11",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
runtime = [
    "antspyx>=0.5.3",
    "arq>=0.28.0",
    "authlib>=1.9.4",
    "dcm2niix>=1.0.20260724",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "joserfc>=1.8.0",
    "monai[nibabel]>=1.6.1",
    "nibabel>=5.4.2",
    "nilearn>=0.14.1",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.1",
    "pydicom>=3.0.2",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cerberus_api"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cerberus_api", "conftest"]

[tool.pyright]
include = ["backend"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
extraPaths = ["backend/tests"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["slow: tests que usan el modelo MONAI real o dcm2niix real"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
