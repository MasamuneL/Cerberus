# Overlay de demo local. Genera .env.auth con tools/auth/bootstrap.py y pásalo con --env-file.
# A1 instala el proveedor; las rutas/sesiones y la protección de recursos se completan en A2/A3.
services:
  auth-db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${CERBERUS_AUTH_DB_PASSWORD:?Ejecuta tools/auth/bootstrap.py y usa --env-file .env.auth}"
    volumes:
      - auth-db-data:/var/lib/postgresql
    networks: [identity-db]
    restart: unless-stopped
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KCRAW_DB_PASSWORD: "${CERBERUS_AUTH_DB_PASSWORD:?Falta contraseña de PostgreSQL}"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${CERBERUS_KEYCLOAK_ADMIN_USERNAME:-cerberus-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${CERBERUS_KEYCLOAK_ADMIN_PASSWORD:?Falta contraseña administrativa}"
      KC_HOSTNAME: "http://localhost:${CERBERUS_KEYCLOAK_HTTP_PORT:-8081}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      CERBERUS_APP_ORIGIN: "${CERBERUS_APP_ORIGIN:-http://localhost:8080}"
      CERBERUS_OIDC_CLIENT_SECRET: "${CERBERUS_OIDC_CLIENT_SECRET:?Falta secreto del cliente OIDC}"
    ports:
      - "127.0.0.1:${CERBERUS_KEYCLOAK_HTTP_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/cerberus-realm.json:ro
    networks: [default, identity-db]
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  api:
    environment:
      CERBERUS_AUTH_MODE: oidc
      CERBERUS_APP_ORIGIN: "${CERBERUS_APP_ORIGIN:-http://localhost:8080}"
      CERBERUS_OIDC_ISSUER_URL: "http://localhost:${CERBERUS_KEYCLOAK_HTTP_PORT:-8081}/realms/cerberus"
      CERBERUS_OIDC_BACKCHANNEL_URL: http://keycloak:8080/realms/cerberus
      CERBERUS_OIDC_CLIENT_ID: cerberus-web
      CERBERUS_OIDC_CLIENT_SECRET: "${CERBERUS_OIDC_CLIENT_SECRET:?Falta secreto del cliente OIDC}"
      CERBERUS_AUTH_COOKIE_SECURE: "false"
      CERBERUS_CORS_ORIGINS: '["${CERBERUS_APP_ORIGIN:-http://localhost:8080}"]'
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  identity-db:
    internal: true

volumes:
  auth-db-data:
  keycloak-data:
