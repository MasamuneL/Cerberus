# Perfil GPU NVIDIA (HW1, docs/PLAN_MVP.md §25): Linux o Windows con WSL2, driver NVIDIA ≥ 525 y NVIDIA Container
# Toolkit (en Docker Desktop para Windows viene incluido con el backend WSL2).
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
# Solo el worker usa la GPU (segmentación MONAI con autocast fp16); la API y el resto siguen con la imagen CPU.
# El registro ANTs de las áreas de Brodmann es solo CPU.
services:
  worker:
    image: cerberus-backend:cuda
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        TORCH_VARIANT: cu126
    environment:
      # Las ruedas de PyTorch traen CUDA; el runtime de NVIDIA solo monta el driver y las utilidades.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
