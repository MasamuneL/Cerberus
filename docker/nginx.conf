worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    # Las redirecciones relativas no filtran el puerto interno 8080.
    absolute_redirect off;

    # El proceso no privilegiado solo escribe en /tmp (tmpfs con rootfs de solo lectura).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # client_max_body_size = CERBERUS_MAX_UPLOAD_MB + 64 MiB de margen multipart. El arranque genera
    # este archivo; la API sigue aplicando el límite exacto al archivo (413).
    include /tmp/cerberus-upload.conf;
    client_body_timeout 600s;
    send_timeout 1800s;

    # Subidas y descargas en streaming: sin copiar DICOM ni NIfTI completos a /tmp.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # Solo texto: los .nii.gz (application/gzip) y las fuentes woff2 ya van comprimidos.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    # Docker resuelve de nuevo el servicio si cambia su IP al recrearlo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Un solo add_header por nivel: en Nginx, un add_header dentro de location anula los heredados.
    # Un valor vacío omite la cabecera (respuestas de la API).
    map $uri $cerberus_cache {
        default "";
        ~^/assets/ "public, max-age=31536000, immutable";
        /index.html "no-cache";
    }

    # Niivue: imágenes blob:/data:, WebAssembly de los códecs zarr desde data: y estilos en línea de React.
    # Swagger (/docs) carga recursos de un CDN, así que la API queda fuera de esta política.
    map $uri $cerberus_csp {
        default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        ~^/(api/|api$|docs|redoc$|openapi\.json$) "";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        set $api_upstream api:8000;

        add_header Cache-Control $cerberus_cache;
        add_header Content-Security-Policy $cerberus_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Sin URI en proxy_pass: conserva /api, query, Range y método HEAD.
        # Los fallos de upstream incluyen la query en el error log de nginx; el callback lleva code/state.
        location ~ ^/api/auth/callback/*$ {
            error_log /dev/null crit;
            proxy_pass http://$api_upstream;
        }

        location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc$|openapi\.json$) {
            proxy_pass http://$api_upstream;
        }

        # Archivos con hash: inmutables; uno ausente es 404, nunca index.html.
        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
