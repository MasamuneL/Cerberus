worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # El proceso no privilegiado solo necesita escribir en /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # La API aplica CERBERUS_MAX_UPLOAD_MB al archivo, sin contar el multipart.
    client_max_body_size 0;
    client_body_timeout 1800s;
    send_timeout 1800s;

    # No guardar DICOM ni NIfTI completos en buffers temporales del proxy.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # Docker resuelve de nuevo el servicio si cambia su IP al recrearlo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        set $api_upstream api:8000;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Sin URI en proxy_pass: conserva /api, query, Range y método HEAD.
        location ~ ^/(api(?:/|$)|docs(?:/|$)|redoc$|openapi\.json$) {
            proxy_pass http://$api_upstream;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
